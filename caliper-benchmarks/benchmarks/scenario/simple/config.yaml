test:
  name: maci-vote-benchmark
  description: Benchmark for MACI vote submissions
  workers:
    number: 1
  rounds:
    - label: vote-submission
      description: Submit encrypted votes to MACI Poll contract
      txNumber: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workload/ethereum/submitVote.js
        arguments:
          pollId: 3
          maxVoteOptions: 25
          coordinatorPublicKey: "macipk.946c756cb8588f7169d37e23a98b92051359d64321cf7372a75757b5e9d5590d" # Replace with actual coordinator public key
          maxVoteWeight: 100
          usersPerWorker: 10

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          include: [dev*, couch*, peer*, orderer*]
          queries:
            - name: "Avg Memory (MB)"
              query: 'sum(container_memory_rss{name=~".+"}) by (name)'
              step: 1
              label: name
              statistic: avg
              multiplier: 0.000001

  transaction:
    - module: logging
      options:
        logfile: logs/maci-benchmark.log

observers:
  - none
