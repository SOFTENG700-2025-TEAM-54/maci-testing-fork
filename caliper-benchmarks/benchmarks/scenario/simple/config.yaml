test:
  name: maci-vote-benchmark
  description: Benchmark for MACI vote submissions
  workers:
    number: 1
  rounds:
    - label: vote-submission
      description: Submit encrypted votes to MACI Poll contract
      txNumber: 10
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: workload/ethereum/submitVote.js
        arguments:
          pollId: 0
          maxVoteOptions: 25
          coordinatorPublicKey: "macipk.1ccff4a32d72c267800bbdab8f9a40707fbe31b4db81017516e6e94dcc31a7a9" # Replace with actual coordinator public key
          maxVoteWeight: 100
          usersPerWorker: 10

monitors:
  resource:
    - module: prometheus
      options:
        url: "http://localhost:9090"
        metrics:
          include: [dev*, couch*, peer*, orderer*]
          queries:
            - name: "Avg Memory (MB)"
              query: 'sum(container_memory_rss{name=~".+"}) by (name)'
              step: 1
              label: name
              statistic: avg
              multiplier: 0.000001

  transaction:
    - module: logging
      options:
        logfile: logs/maci-benchmark.log

observers:
  - none
