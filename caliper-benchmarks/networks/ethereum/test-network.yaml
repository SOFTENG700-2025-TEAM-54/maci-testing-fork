caliper:
  blockchain: ethereum
  # Optional start/stop commands to control your local test network.
  command:
    start: "docker-compose -f network/ethereum/1node-clique/docker-compose.yml up -d && sleep 3"
    end: "docker-compose -f network/ethereum/1node-clique/docker-compose.yml down"

ethereum:
  # URL of your Ethereum node (must be a WebSocket endpoint)
  url: "https://eth-sepolia.g.alchemy.com/v2/b6UdaiWULIzetbDZLhoH5"

  # Account used to deploy smart contracts.
  # Provide the private key if you want Caliper to sign transactions "raw".
  contractDeployerAddress: "0xA79053FE93e83a2b8c112A0C963Ed1B5Ba93F5ef"
  contractDeployerAddressPrivateKey: "00856a60334f85073cce7d9c4cc32cc473d6abd5a93ef98d982e30db58b572d6"
  # If using a private key, the password is not used. Otherwise, set contractDeployerAddressPassword.
  contractDeployerAddressPassword: ""

  # Benchmark (from) address: account used to invoke the contract methods during the benchmark.
  fromAddress: "0xA79053FE93e83a2b8c112A0C963Ed1B5Ba93F5ef"
  fromAddressPrivateKey: "00856a60334f85073cce7d9c4cc32cc473d6abd5a93ef98d982e30db58b572d6"
  fromAddressPassword: ""

  # Number of block confirmations to wait for a transaction to be considered successful.
  transactionConfirmationBlocks: 3

  # Contracts to be deployed or attached to before running the benchmark.
  contracts:
    simple:
      # Path to the JSON file containing the contract's name, ABI, bytecode, and deployment gas settings.
      path: "src/contract/ethereum/simple/simple.json"
      gas:
        open: 45000
        query: 100000
        transfer: 70000
