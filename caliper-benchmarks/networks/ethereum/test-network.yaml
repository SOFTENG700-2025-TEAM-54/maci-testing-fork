name: MACI-Ethereum-Test
version: "2.0.0"

caliper:
  blockchain: ethereum

channels:
  - channelName: mychannel
    contracts:
      - id: Poll
        address: "0xYourPollContractAddress" # Replace with actual deployed Poll contract address
        gas:
          gasLimit: 3000000
          gasPrice: 20000000000
        abi: ../../abi/Poll.abi.json # Path to Poll contract ABI

ethereum:
  url: wss://sepolia.infura.io/ws/v3/YOUR_PROJECT_ID # Replace with your Sepolia WebSocket URL
  contractDeployerAddress: "0xYourDeployerAddress" # Replace with your deployer address
  contractDeployerAddressPrivateKey: "0xYourPrivateKey" # Replace with your private key
  fromAddressSeed: "0xYourSeedAddress" # Replace with seed address
  fromAddressPrivateKeySeed: "0xYourSeedPrivateKey" # Replace with seed private key
  transactionConfirmationBlocks: 1
  accounts:
    - address: "0xYourAccountAddress" # Replace with your account address
      privateKey: "0xYourAccountPrivateKey" # Replace with your account private key

# MACI-specific configuration for the workload
maciConfig:
  pollId: 0
  maxVoteOptions: 25
  coordinatorPublicKey: "macipk.946c756cb8588f7169d37e23a98b92051359d64321cf7372a75757b5e9d5590d" # Replace with actual coordinator public key
  maxVoteWeight: 100
  usersPerWorker: 10
